name: macOS build & tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          node --version
          system_profiler SPDisplaysDataType | sed -n '1,30p' || true

      - name: Unit tests (DanmakuCore)
        run: swift test

      - name: Build URBAN LIVE.app + DMG (Apple silicon + Intel)
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Install test tools
        working-directory: tests
        run: npm ci

      - name: Loopback aliases (simulate 200 phones with different IPs)
        run: for i in $(seq 2 215); do sudo ifconfig lo0 alias "127.0.0.$i" up; done

      - name: Integration tests (protocol, QR, styles, full-screen overlay, phone e2e, 200-phone load test)
        run: ./scripts/smoke-test.sh
        env:
          # 設為 "1" 會把截圖縮圖以 base64 印在 log（無法下載 Artifacts 時用）
          PRINT_PREVIEWS: "1"

      - name: Upload app (DMG + ZIP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: URBAN-LIVE-macOS
          path: |
            dist/URBAN-LIVE.dmg
            dist/URBAN-LIVE.zip
          if-no-files-found: ignore

      - name: Upload test results & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: dist/smoke/
          if-no-files-found: ignore
